<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E807A"/>
      <stop offset="1" stop-color="#7CB2AA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="675" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="675" fill="url(#bg)"/>
    <!-- soft holding circles -->
    <circle cx="320" cy="470" r="330" fill="url(#glow)"/>
    <circle cx="320" cy="470" r="328" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="210" cy="360" r="210" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="210" cy="360" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <!-- embrace line -->
    <path d="M 60 220 C 380 360, 760 150, 1140 300" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2.5" stroke-linecap="round"/>
    <!-- brand heart accent -->
    <path transform="translate(470,300) scale(1.6)" fill="#FDBB2E"
      d="M10 6.2 C10 3.5 6.2 2.6 5 5.1 C3.8 2.6 0 3.5 0 6.2 C0 8.9 5 12 5 12 C5 12 10 8.9 10 6.2 Z"/>
    <!-- text -->
    <text x="64" y="84" font-family="Quicksand, 'Segoe UI', system-ui, sans-serif" font-size="26" letter-spacing="3" fill="#ffffff" fill-opacity="0.85" font-weight="600">THE LITTLEHUGS JOURNAL</text>
    <text x="62" y="600" font-family="Quicksand, 'Segoe UI', system-ui, sans-serif" font-size="58" fill="#ffffff" font-weight="700">Everyday care</text>
    <rect x="64" y="624" width="92" height="6" rx="3" fill="#FDBB2E"/>
  </g>
</svg>